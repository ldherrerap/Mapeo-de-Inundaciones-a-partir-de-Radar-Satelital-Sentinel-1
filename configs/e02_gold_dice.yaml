name: e02_gold_dice
seed: 42
data_root: data/sen1floods11/v1.1
out_dir: runs
use_s2: false
tune_threshold: true
model:
  base_ch: 32
  depth: 4
  skip_mode: concat
  dropout: 0.1
loss:
  kind: dice
  pos_weight: 3.0
  alpha: 0.5
train:
  epochs: 60
  batch_size: 16
  lr: 0.001
  weight_decay: 0.0001
  crop: 256
  num_workers: 2
  patience: 15
weak:
  mode: none
  source: S1OtsuLabelWeak
  weight: 0.5
  gold_ratio: 0.5
  max_chips: null
  pretrain_epochs: 20
